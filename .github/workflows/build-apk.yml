name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web files
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
      - name: Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Журнал" com.school.journal --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Icon
        run: |
          pip install pillow
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 make_icons.py
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: journal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
